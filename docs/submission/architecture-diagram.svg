<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Stormsboys AI Agents Architecture</title>
  <desc id="desc">Cloud Run web and API connected to an ADK-first agent layer, Gemini, Cloud SQL pgvector, Secret Manager, traces, and Publisher/Admin exports.</desc>
  <defs>
    <style>
      .bg { fill: #f5f8fb; }
      .box { fill: #ffffff; stroke: #c8d6e2; stroke-width: 2; rx: 8; }
      .cloud { fill: #e9f2ff; stroke: #2c5f9e; }
      .agent { fill: #eaf8f2; stroke: #1f7a6d; }
      .judge { fill: #fff4df; stroke: #b78a3b; }
      .export { fill: #f2ecff; stroke: #6c4bb3; }
      .title { fill: #18202a; font-family: Arial, sans-serif; font-size: 26px; font-weight: 700; }
      .label { fill: #18202a; font-family: Arial, sans-serif; font-size: 16px; font-weight: 700; }
      .small { fill: #536273; font-family: Arial, sans-serif; font-size: 13px; }
      .line { stroke: #7890a4; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7890a4" />
    </marker>
  </defs>

